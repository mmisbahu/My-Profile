<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixtures & Schedule - Soccer World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-futbol"></i> Soccer World
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="leagues.html">Leagues</a></li>
                    <li class="nav-item"><a class="nav-link" href="national-teams.html">National Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="live-scores.html">Live Scores</a></li>
                    <li class="nav-item"><a class="nav-link active" href="fixtures.html">Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link" href="teams-players.html">Teams & Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">My Favorites</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Filters -->
        <section class="section">
            <h2><i class="fas fa-calendar-alt"></i> Fixtures & Schedule</h2>
            <div class="row g-3 mb-4">
                <div class="col-md-3">
                    <select class="form-select" id="leagueFilter">
                        <option value="">All Leagues</option>
                        <option value="39">Premier League</option>
                        <option value="140">La Liga</option>
                        <option value="78">Bundesliga</option>
                        <option value="135">Serie A</option>
                        <!-- Add more options -->
                    </select>
                </div>
                <div class="col-md-3">
                    <select class="form-select" id="teamFilter">
                        <option value="">All Teams</option>
                        <!-- Teams will be populated dynamically -->
                    </select>
                </div>
                <div class="col-md-3">
                    <input type="date" class="form-control" id="dateFilter">
                </div>
                <div class="col-md-3">
                    <button class="btn w-100" id="filterBtn">Apply Filters</button>
                </div>
            </div>
        </section>

        <!-- Fixtures List -->
        <section class="section">
            <div id="fixturesList">
                <!-- Fixtures will be populated here -->
            </div>
        </section>

        <!-- Countdown to Next Big Match -->
        <section class="section">
            <h2><i class="fas fa-clock"></i> Next Big Match</h2>
            <div class="match-card text-center" id="nextBigMatch">
                <!-- Next big match countdown will be shown here -->
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/fixtures.js"></script>
</body>
</html>
