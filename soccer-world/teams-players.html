<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teams & Players - Soccer World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-futbol"></i> Soccer World
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="leagues.html">Leagues</a></li>
                    <li class="nav-item"><a class="nav-link" href="national-teams.html">National Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="live-scores.html">Live Scores</a></li>
                    <li class="nav-item"><a class="nav-link" href="fixtures.html">Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link active" href="teams-players.html">Teams & Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">My Favorites</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Search -->
        <section class="section">
            <h2><i class="fas fa-search"></i> Search Teams & Players</h2>
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search for teams or players...">
                <button class="btn" id="searchBtn"><i class="fas fa-search"></i> Search</button>
            </div>
        </section>

        <!-- Search Results -->
        <section class="section" id="searchResults" style="display: none;">
            <h3>Search Results</h3>
            <div id="resultsContainer">
                <!-- Search results will be populated here -->
            </div>
        </section>

        <!-- Popular Teams -->
        <section class="section">
            <h2><i class="fas fa-star"></i> Popular Teams</h2>
            <div class="leagues-grid" id="popularTeams">
                <!-- Popular teams will be populated here -->
            </div>
        </section>

        <!-- Popular Players -->
        <section class="section">
            <h2><i class="fas fa-user"></i> Popular Players</h2>
            <div class="matches-grid" id="popularPlayers">
                <!-- Popular players will be populated here -->
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/teams-players.js"></script>
</body>
</html>
