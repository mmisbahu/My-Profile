<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>National Teams - Soccer World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-futbol"></i> Soccer World
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="leagues.html">Leagues</a></li>
                    <li class="nav-item"><a class="nav-link active" href="national-teams.html">National Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="live-scores.html">Live Scores</a></li>
                    <li class="nav-item"><a class="nav-link" href="fixtures.html">Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link" href="teams-players.html">Teams & Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">My Favorites</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Continent Filter -->
        <section class="section">
            <h2><i class="fas fa-globe"></i> National Teams</h2>
            <div class="mb-4">
                <div class="btn-group" role="group">
                    <input type="radio" class="btn-check" name="continent" id="all" autocomplete="off" checked>
                    <label class="btn btn-outline-primary" for="all">All</label>

                    <input type="radio" class="btn-check" name="continent" id="europe" autocomplete="off">
                    <label class="btn btn-outline-primary" for="europe">Europe</label>

                    <input type="radio" class="btn-check" name="continent" id="america" autocomplete="off">
                    <label class="btn btn-outline-primary" for="america">Americas</label>

                    <input type="radio" class="btn-check" name="continent" id="africa" autocomplete="off">
                    <label class="btn btn-outline-primary" for="africa">Africa</label>

                    <input type="radio" class="btn-check" name="continent" id="asia" autocomplete="off">
                    <label class="btn btn-outline-primary" for="asia">Asia</label>

                    <input type="radio" class="btn-check" name="continent" id="oceania" autocomplete="off">
                    <label class="btn btn-outline-primary" for="oceania">Oceania</label>
                </div>
            </div>
        </section>

        <!-- Teams Grid -->
        <section class="section">
            <div class="leagues-grid" id="nationalTeams">
                <!-- National teams will be populated here -->
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/national-teams.js"></script>
</body>
</html>
