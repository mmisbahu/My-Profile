<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Scores - Soccer World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-futbol"></i> Soccer World
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="leagues.html">Leagues</a></li>
                    <li class="nav-item"><a class="nav-link" href="national-teams.html">National Teams</a></li>
                    <li class="nav-item"><a class="nav-link active" href="live-scores.html">Live Scores</a></li>
                    <li class="nav-item"><a class="nav-link" href="fixtures.html">Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link" href="teams-players.html">Teams & Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">My Favorites</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- Filters -->
        <section class="section">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h2><i class="fas fa-bolt"></i> Live Scores</h2>
                <div>
                    <select class="form-select d-inline-block w-auto" id="leagueFilter">
                        <option value="">All Leagues</option>
                        <option value="39">Premier League</option>
                        <option value="140">La Liga</option>
                        <option value="78">Bundesliga</option>
                        <option value="135">Serie A</option>
                        <!-- Add more leagues -->
                    </select>
                </div>
            </div>
        </section>

        <!-- Live Matches -->
        <section class="section">
            <div class="matches-grid" id="liveMatches">
                <!-- Live matches will be populated here -->
            </div>
        </section>

        <!-- Auto-refresh indicator -->
        <div class="text-center text-muted mt-4">
            <small>Auto-refreshing every 60 seconds <i class="fas fa-sync fa-spin"></i></small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/live-scores.js"></script>
</body>
</html>
