<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Major Leagues - Soccer World</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <i class="fas fa-futbol"></i> Soccer World
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="leagues.html">Leagues</a></li>
                    <li class="nav-item"><a class="nav-link" href="national-teams.html">National Teams</a></li>
                    <li class="nav-item"><a class="nav-link" href="live-scores.html">Live Scores</a></li>
                    <li class="nav-item"><a class="nav-link" href="fixtures.html">Fixtures</a></li>
                    <li class="nav-item"><a class="nav-link" href="teams-players.html">Teams & Players</a></li>
                    <li class="nav-item"><a class="nav-link" href="tournaments.html">Tournaments</a></li>
                    <li class="nav-item"><a class="nav-link" href="news.html">News</a></li>
                    <li class="nav-item"><a class="nav-link" href="favorites.html">My Favorites</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <!-- League Selection -->
        <section class="section">
            <h2><i class="fas fa-trophy"></i> Select League</h2>
            <div class="leagues-grid" id="leagueSelector">
                <!-- League selector will be populated here -->
            </div>
        </section>

        <!-- League Standings -->
        <section class="section" id="standingsSection" style="display: none;">
            <h2 id="leagueTitle"><i class="fas fa-list-ol"></i> League Standings</h2>
            <div class="table-responsive">
                <table class="standings-table" id="standingsTable">
                    <thead>
                        <tr>
                            <th>Pos</th>
                            <th>Team</th>
                            <th>MP</th>
                            <th>W</th>
                            <th>D</th>
                            <th>L</th>
                            <th>GF</th>
                            <th>GA</th>
                            <th>GD</th>
                            <th>Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standingsBody">
                        <!-- Standings will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Top Scorers -->
        <section class="section" id="topScorersSection" style="display: none;">
            <h2><i class="fas fa-futbol"></i> Top Scorers</h2>
            <div class="table-responsive">
                <table class="standings-table" id="topScorersTable">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Player</th>
                            <th>Team</th>
                            <th>Goals</th>
                        </tr>
                    </thead>
                    <tbody id="topScorersBody">
                        <!-- Top scorers will be populated here -->
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Upcoming Fixtures -->
        <section class="section" id="fixturesSection" style="display: none;">
            <h2><i class="fas fa-calendar-plus"></i> Upcoming Fixtures</h2>
            <div class="matches-grid" id="upcomingFixtures">
                <!-- Upcoming fixtures will be populated here -->
            </div>
        </section>

        <!-- Recent Results -->
        <section class="section" id="resultsSection" style="display: none;">
            <h2><i class="fas fa-history"></i> Recent Results</h2>
            <div class="matches-grid" id="recentResults">
                <!-- Recent results will be populated here -->
            </div>
        </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js"></script>
    <script src="js/leagues.js"></script>
</body>
</html>
