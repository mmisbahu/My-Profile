<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Forecast App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark mode">🌙</button>
    <div class="container">
        <div class="header">
            <h1>Weather</h1>
            <div class="search-bar">
                <input 
                    type="text" 
                    id="cityInput" 
                    placeholder="Search city..." 
                    autocomplete="off"
                    aria-label="Search city"
                >
                <button id="searchBtn" aria-label="Search">Search</button>
            </div>
        </div>

        <div id="errorMessage" class="error-message"></div>

        <div class="weather-container">
            <!-- Current Weather -->
            <section class="current-weather">
                <div class="location-info">
                    <h2 id="cityName">--</h2>
                    <p id="currentDate">--</p>
                </div>
                <div class="weather-main">
                    <div class="temperature-section">
                        <span id="temperature" class="temperature">--°</span>
                        <p id="description" class="description">--</p>
                    </div>
                    <div class="weather-icon" id="weatherIcon" role="img" aria-label="Weather condition">
                        ☁️
                    </div>
                </div>
                <div class="weather-details">
                    <div class="detail">
                        <span class="label">Feels Like</span>
                        <span id="feelsLike" class="value">--°</span>
                    </div>
                    <div class="detail">
                        <span class="label">Humidity</span>
                        <span id="humidity" class="value">--%</span>
                    </div>
                    <div class="detail">
                        <span class="label">Wind</span>
                        <span id="windSpeed" class="value">-- km/h</span>
                    </div>
                    <div class="detail">
                        <span class="label">Pressure</span>
                        <span id="pressure" class="value">-- hPa</span>
                    </div>
                </div>
            </section>

            <!-- 5-Day Forecast -->
            <section class="forecast-section">
                <h3>5-Day Forecast</h3>
                <div class="forecast-container" id="forecastContainer">
                    <!-- Forecast cards will be populated here -->
                </div>
            </section>
        </div>

        <footer class="footer">
            <p>Weather data powered by Open-Meteo</p>
        </footer>
    </div>

    <script src="script.js"></script>
</body>
</html>
